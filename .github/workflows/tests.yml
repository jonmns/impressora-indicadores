name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Dependências
        run: |
          python -m pip install playwright==1.64.1 openpyxl==3.1.5
          python -m playwright install --with-deps chromium
      - name: Servir a pasta
        run: |
          python -m http.server 8931 --directory . > /tmp/server.log 2>&1 &
          sleep 2
      - name: tests.html (inclui OCR real de um quadro desenhado em canvas)
        run: python dev/run_tests.py http://127.0.0.1:8931
      - name: Fluxo completo com PDFs de texto sintéticos
        run: |
          mkdir -p "$RUNNER_TEMP/fixtures"
          python dev/make_fixtures.py "$RUNNER_TEMP/fixtures"
          python dev/run.py http://127.0.0.1:8931 "$RUNNER_TEMP/fixtures" | tee "$RUNNER_TEMP/run.txt"
          ! grep -q '"isErr": true' "$RUNNER_TEMP/run.txt"
          ! grep -q '"errs": \["' "$RUNNER_TEMP/run.txt"
